id = "witwin.volume"
name = "Volume"
version = "0.1.0"
description = "Viewport renderers for volume, SDF, and field data."
enabled = true
repository = "https://github.com/witwin-ai/wt_volume"
# The web half adds visualizers, passes and the Field Slice panel to the viewport.
# studio.em: the Field component the volume demos use (2026-11-03).
pluginDependencies = [{ id = "studio.viewport", optional = true }, { id = "studio.em" }]

[engines]
witwin = "^2.0.0"

[web]
root = "web"

[contributes.viewport.host]
entry = "viewport.js"
sdkVersion = "2.0.0"

[permissions]
frontend = true
shader = true
