id = "witwin.rendering"
name = "WiTwin Rendering"
version = "0.1.0"
description = "First-party viewport renderers for Volume, SDF, Point Cloud, and Field presentation."
enabled = true

[engines]
witwin = "^1.0.0"

[web]
root = "web"

[contributes.viewport.host]
entry = "viewport.js"
sdkVersion = "1.0.0"

[[contributes.viewport.passes]]
id = "witwin.rendering.volumeDepth"
builtin = "volumeDepth"

[permissions]
frontend = true
shader = true
