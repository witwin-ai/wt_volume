id = "witwin.volume"
name = "Volume"
version = "0.1.0"
description = "Viewport renderers for volume, SDF, and field data."
enabled = true
repository = "https://github.com/witwin-ai/wt_volume"
# The web half adds visualizers, passes and the Field Slice panel to the viewport.
pluginDependencies = [{ id = "studio.viewport", optional = true }]

[engines]
witwin = "^1.0.0"

[web]
root = "web"

[contributes.viewport.host]
entry = "viewport.js"
sdkVersion = "2.0.0"

[permissions]
frontend = true
shader = true
