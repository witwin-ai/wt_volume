id = "witwin.volume"
name = "WiTwin Volume"
version = "0.1.0"
description = "First-party viewport renderers for volume, SDF, and field presentation."
enabled = true
repository = "https://github.com/witwin-ai/wt_volume"

[engines]
witwin = "^1.0.0"

[web]
root = "web"

[contributes.viewport.host]
entry = "viewport.js"
sdkVersion = "1.0.0"

[permissions]
frontend = true
shader = true
